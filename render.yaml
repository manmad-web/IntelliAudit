services:
  - type: web
    name: intelliaudit-accountant-review
    runtime: python
    plan: free
    region: oregon
    repo: https://github.com/manmad-web/IntelliAudit
    branch: codex/accountant-review-dashboard
    buildCommand: pip install -r requirements-hosted.txt
    startCommand: python -m dashboard.server --hosted --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeployTrigger: off
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_ACCESS_CODE
        sync: false
